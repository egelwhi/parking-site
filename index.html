<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="This domain is temporarily parked.">
	<meta name="theme-color" content="#5195E1">
	<title>Domain parked</title>
	<style>
		:root {
			--ink: #17314b;
			--muted: #58718a;
			--paper: #edf5fc;
			--surface: #f9fcff;
			--line: #c9dced;
			--blue: #5195E1;
			--blue-dark: #1e4f80;
			--yellow: #e8b84e;
			--shadow: 0 24px 70px rgba(45, 93, 140, .15);
		}

		* { box-sizing: border-box; }

		html { min-width: 320px; background: var(--paper); }

		body {
			margin: 0;
			color: var(--ink);
			background:
				radial-gradient(circle at 87% 14%, rgba(81, 149, 225, .25) 0 7rem, transparent 7.1rem),
				linear-gradient(135deg, rgba(255,255,255,.55), transparent 40%),
				var(--paper);
			font-family: Georgia, "Times New Roman", serif;
			min-height: 100vh;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: .25;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
			mix-blend-mode: multiply;
		}

		.page {
			width: min(1120px, calc(100% - 48px));
			min-height: 100vh;
			margin: 0 auto;
			display: grid;
			grid-template-rows: auto 1fr auto;
			position: relative;
			z-index: 1;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 32px 0;
			border-bottom: 1px solid rgba(81, 149, 225, .25);
		}

		.mark {
			display: inline-flex;
			gap: 11px;
			align-items: center;
			color: var(--blue-dark);
			font: 700 12px/1.1 Arial, sans-serif;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		.mark-dot {
			width: 13px;
			height: 13px;
			border-radius: 50%;
			background: var(--yellow);
			box-shadow: 5px -4px 0 var(--blue);
		}

		.status {
			color: var(--muted);
			font: 500 11px/1.4 Arial, sans-serif;
			letter-spacing: .1em;
			text-transform: uppercase;
		}

		main {
			display: grid;
			align-items: center;
			grid-template-columns: minmax(0, 1fr) 330px;
			gap: clamp(40px, 9vw, 130px);
			padding: 78px 0 96px;
		}

		.copy { animation: rise .75s ease-out both; }

		.eyebrow {
			margin: 0 0 22px;
			color: var(--blue-dark);
			font: 700 12px/1.2 Arial, sans-serif;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 650px;
			margin: 0;
			font-size: clamp(50px, 7.3vw, 93px);
			font-weight: 400;
			letter-spacing: -.055em;
			line-height: .92;
		}

		h1 em { color: var(--blue-dark); font-style: italic; }

		.intro {
			max-width: 500px;
			margin: 32px 0 0;
			color: var(--muted);
			font-size: 19px;
			line-height: 1.55;
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			margin-top: 34px;
		}

		.button {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			min-height: 48px;
			padding: 0 19px;
			border: 1px solid var(--blue-dark);
			border-radius: 2px;
			color: #fff;
			background: var(--blue-dark);
			font: 700 13px/1 Arial, sans-serif;
			letter-spacing: .03em;
			text-decoration: none;
			transition: transform .2s ease, background .2s ease;
		}

		.button:hover { background: var(--blue); transform: translateY(-2px); }

		.button.secondary { color: var(--blue-dark); background: transparent; }
		.button.secondary:hover { color: var(--ink); background: rgba(255,255,255,.55); }

		.arrow { font-size: 18px; line-height: 0; }

		.domain-card {
			align-self: center;
			padding: 27px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: rgba(251, 250, 246, .78);
			box-shadow: var(--shadow);
			animation: rise .75s .12s ease-out both;
		}

		.card-label {
			display: block;
			margin-bottom: 28px;
			color: var(--muted);
			font: 700 10px/1.2 Arial, sans-serif;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		.domain {
			overflow-wrap: anywhere;
			color: var(--blue-dark);
			font-size: clamp(25px, 3vw, 35px);
			letter-spacing: -.035em;
			line-height: 1.05;
		}

		.card-rule { height: 1px; margin: 25px 0 20px; background: var(--line); }

		.card-note {
			margin: 0;
			color: var(--muted);
			font: 13px/1.55 Arial, sans-serif;
		}

		.card-note strong { color: var(--ink); }

		footer {
			display: flex;
			justify-content: space-between;
			gap: 20px;
			padding: 20px 0 25px;
			border-top: 1px solid rgba(81, 149, 225, .25);
			color: var(--muted);
			font: 11px/1.4 Arial, sans-serif;
		}

		footer a { color: inherit; text-decoration: none; }
		footer a:hover { color: var(--blue-dark); }

		@keyframes rise {
			from { opacity: 0; transform: translateY(14px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 720px) {
			.page { width: min(100% - 36px, 560px); }
			header { padding: 24px 0; }
			.status { display: none; }
			main { display: block; padding: 70px 0 76px; }
			.intro { font-size: 17px; }
			.domain-card { margin-top: 52px; }
			footer { display: block; }
			footer span { display: block; margin-top: 7px; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<a class="mark" href="./" aria-label="Home"><span class="mark-dot" aria-hidden="true"></span>Nothing here</a>
			<span class="status">A quiet place on the web</span>
		</header>

		<main>
			<section class="copy" aria-labelledby="page-title">
				<p class="eyebrow">Domain parked</p>
				<h1 id="page-title">My hard drive is <em>cooked.</em></h1>
				<p class="intro">This address is temporarily parked because of CVEs and my hard drive is cooked. I hate CVEs.</p>
				<div class="actions">
					<a class="button secondary" href="#details">Nothing here <span class="arrow" aria-hidden="true">&#8595;</span></a>
				</div>
			</section>

			<aside class="domain-card" id="details" aria-label="Domain status">
				<span class="card-label">Well</span>
				<div class="domain">tsumuo.com</div>
				<div class="card-rule"></div>
				<p class="card-note"><strong>Temporarily parked.</strong><br>I need cheaper HDD storage.</p>
			</aside>
		</main>

		<footer>
			<span>&copy; 2026 Egelwhi</span>
		</footer>
	</div>
</body>
</html>
